<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calle Sabrosa · Menú y pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FB;--card:#fff;--ink:#14213D;--muted:#5B6578;--line:#DDE2EE;--sun:#F5B700;--chili:#D62828;--onsun:#14213D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1424;--card:#18213A;--ink:#F2F4FA;--muted:#A3ADC4;--line:#2A3556;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1424;--card:#18213A;--ink:#F2F4FA;--muted:#A3ADC4;--line:#2A3556;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "DM Sans",system-ui,sans-serif;padding-bottom:96px}
header{background:var(--sun);color:var(--onsun);padding:28px 20px 22px;border-bottom:6px solid var(--chili)}
header h1{font:400 clamp(34px,9vw,56px)/1 "Bowlby One",Impact,sans-serif;margin:0 0 8px;letter-spacing:.5px}
header p{margin:0;max-width:34ch;font-weight:500}
.wrap{max-width:720px;margin:0 auto}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:8px;padding:12px 20px;overflow-x:auto;z-index:5;border-bottom:1px solid var(--line)}
nav button{flex:none;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:99px;padding:8px 16px;font:700 15px "DM Sans",sans-serif;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg)}
section{padding:8px 20px}
h2{font:400 24px/1.1 "Bowlby One",Impact,sans-serif;margin:26px 0 12px}
.it{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.em{width:64px;height:64px;border-radius:12px;background:var(--sun);display:grid;place-items:center;font-size:34px}
.it b{display:block;font-size:17px}.it small{color:var(--muted);display:block;line-height:1.3}
.pr{font-weight:700;margin-top:4px;display:block}
.ctl{display:flex;align-items:center;gap:8px}
.ctl span{min-width:18px;text-align:center;font-weight:700}
button{font-family:inherit}
.add,.q{border:0;cursor:pointer;font-weight:700}
.add{background:var(--ink);color:var(--bg);border-radius:99px;padding:9px 16px;font-size:15px}
.q{width:34px;height:34px;border-radius:50%;background:var(--chili);color:#fff;font-size:20px;line-height:1}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--chili);outline-offset:2px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:6}
#bar button,.big{width:100%;max-width:680px;display:flex;justify-content:space-between;margin:0 auto;border:0;border-radius:14px;padding:15px 18px;font:700 17px "DM Sans",sans-serif;cursor:pointer;background:var(--chili);color:#fff}
#bar button:disabled{background:var(--line);color:var(--muted);cursor:default}
#sheet{position:fixed;inset:0;background:rgba(10,15,30,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.pan{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.pan h3{font:400 24px "Bowlby One",Impact,sans-serif;margin:0 0 14px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:14px 0}
label{display:block;font-weight:700;margin:10px 0 4px}
input,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.big{margin-top:10px}
.wa{background:#1FA855}.alt{background:var(--ink);color:var(--bg)}
.ghost{background:none;border:0;color:var(--muted);font-weight:700;padding:12px;width:100%;cursor:pointer}
.note{background:var(--bg);border-left:5px solid var(--sun);padding:10px 12px;border-radius:8px;font-size:14px;color:var(--muted);margin:10px 0}
.pm{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pm label{flex:1;min-width:96px;margin:0;border:1.5px solid var(--line);border-radius:10px;padding:12px;text-align:center;cursor:pointer}
.pm input{width:auto;margin-right:6px}
@media (prefers-reduced-motion:no-preference){.pan{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Calle Sabrosa</h1><p>Elige lo que se te antoje y pide en un minuto.</p></div></header>
<nav id="tabs" aria-label="Categorías"></nav>
<main class="wrap" id="menu"></main>
<div id="bar"><button id="open" disabled></button></div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Tu pedido"><div class="pan" id="pan"></div></div>
<script>
// CONFIGURACIÓN DEL CLIENTE: cambia estos datos para cada restaurante
const C={nombre:"Calle Sabrosa",wa:"593998403040",mon:"$",pagoWeb:true};
const M=[
{c:"Platos",i:[["Choripán","🌭","Chorizo a la parrilla, chimichurri y pan crujiente.",3.5],["Salchipapa","🍟","Papas, salchicha, huevo de codorniz y salsas de la casa.",4],["Hamburguesa callejera","🍔","Carne al carbón, queso, cebolla caramelizada y papas.",5.5],["Arepa rellena","🫓","Maíz tostado con pollo desmechado y aguacate.",3.75]]},
{c:"Snacks",i:[["Empanadas x3","🥟","De queso o carne, con ají casero.",3],["Papas criollas","🥔","Fritas con salsa rosada.",2.5],["Choclo con queso","🌽","Mazorca asada con queso fresco.",2.25]]},
{c:"Bebidas",i:[["Limonada de coco","🥥","Fría, con hielo picado.",2],["Jugo natural","🍹","Maracuyá, mora o naranja.",1.75],["Gaseosa 500 ml","🥤","Consulta sabores disponibles.",1.25]]}];
const L=[];M.forEach(m=>m.i.forEach(x=>L.push({n:x[0],e:x[1],d:x[2],p:x[3]})));
const q={},F={nm:"",ci:"",dr:"",pay:"",nt:""};let view="cart";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const $=s=>document.querySelector(s),f=n=>C.mon+n.toFixed(2);
const cnt=()=>Object.values(q).reduce((a,b)=>a+b,0);
const tot=()=>Object.entries(q).reduce((a,[k,v])=>a+L[k].p*v,0);
function chg(k,d){q[k]=Math.max(0,(q[k]||0)+d);if(!q[k])delete q[k];draw()}
function draw(){
 let h="",id=0;
 M.forEach((m,ci)=>{h+=`<section id="c${ci}"><h2>${m.c}</h2>`;
  m.i.forEach(()=>{const k=id++,x=L[k],n=q[k]||0;
   h+=`<div class="it"><div class="em" aria-hidden="true">${x.e}</div><div><b>${x.n}</b><small>${x.d}</small><span class="pr">${f(x.p)}</span></div>
   <div class="ctl">${n?`<button class="q" aria-label="Quitar ${x.n}" onclick="chg(${k},-1)">−</button><span>${n}</span><button class="q" aria-label="Agregar ${x.n}" onclick="chg(${k},1)">+</button>`:`<button class="add" onclick="chg(${k},1)">Agregar</button>`}</div></div>`});
  h+="</section>"});
 $("#menu").innerHTML=h;
 $("#tabs").innerHTML=M.map((m,i)=>`<button onclick="document.getElementById('c${i}').scrollIntoView({behavior:'smooth'})">${m.c}</button>`).join("");
 const b=$("#open");b.disabled=!cnt();
 b.innerHTML=cnt()?`<span>Ver pedido (${cnt()})</span><span>${f(tot())}</span>`:`<span>Tu pedido está vacío</span>`;
 if(!$("#sheet").hidden)sheet();
}
function lines(){return Object.entries(q).map(([k,v])=>`${v} x ${L[k].n} (${f(L[k].p*v)})`)}
function sheet(){
 const p=$("#pan");
 if(view==="cart"){
  p.innerHTML=`<h3>Tu pedido</h3>`+Object.entries(q).map(([k,v])=>`<div class="ln"><span>${L[k].n}<br><small>${f(L[k].p)} c/u</small></span><span class="ctl"><button class="q" aria-label="Quitar uno" onclick="chg(${k},-1)">−</button><span>${v}</span><button class="q" aria-label="Agregar uno" onclick="chg(${k},1)">+</button></span></div>`).join("")+
  `<div class="tot"><span>Total</span><span>${f(tot())}</span></div>
  <label for="nm">Nombre completo</label><input id="nm" autocomplete="name" value="${esc(F.nm)}" oninput="F.nm=this.value">
  <label for="ci">DNI / C.I.</label><input id="ci" inputmode="numeric" autocomplete="off" value="${esc(F.ci)}" oninput="F.ci=this.value">
  <label for="dr">Dirección de entrega</label><input id="dr" autocomplete="street-address" placeholder="Calle, número y referencia" value="${esc(F.dr)}" oninput="F.dr=this.value">
  <label>Medio de pago</label><div class="pm">${["Nequi","Daviplata","Efectivo"].map(x=>`<label><input type="radio" name="pg" value="${x}" ${F.pay===x?"checked":""} onchange="F.pay=this.value">${x}</label>`).join("")}</div>
  <label for="nt">Notas (opcional)</label><textarea id="nt" rows="2" placeholder="Sin cebolla, sin ají…" oninput="F.nt=this.value">${esc(F.nt)}</textarea>
  <p id="er" role="alert" style="color:var(--chili);font-weight:700;margin:8px 0 0"></p>
  <button class="big wa" onclick="sendWA()"><span>Enviar pedido por WhatsApp</span></button>
  ${C.pagoWeb?`<button class="big alt" onclick="view='pay';sheet()"><span>Pagar en la web</span></button>`:""}
  <button class="ghost" onclick="closeS()">Seguir pidiendo</button>`;
 }else if(view==="pay"){
  p.innerHTML=`<h3>Pago en línea</h3><div class="note">Esto es una demostración: no se cobra nada. En la versión real, este paso abre la pasarela de pago del restaurante.</div>
  <div class="pm"><label><input type="radio" name="m" checked>Tarjeta</label><label><input type="radio" name="m">Transferencia</label></div>
  <div class="tot"><span>Total</span><span>${f(tot())}</span></div>
  <button class="big" onclick="view='done';sheet()"><span>Pagar ${f(tot())}</span></button>
  <button class="ghost" onclick="view='cart';sheet()">Volver al pedido</button>`;
 }else{
  p.innerHTML=`<h3>¡Pedido recibido!</h3><p>Pago simulado correcto. El restaurante vería tu pedido y te avisaría cuando esté listo.</p><button class="big" onclick="reset()"><span>Hacer otro pedido</span></button>`;
 }
}
function sendWA(){
 const g=k=>(F[k]||"").trim(),miss=[];
 if(!g("nm"))miss.push("nombre");if(!g("ci"))miss.push("DNI / C.I.");if(!g("dr"))miss.push("dirección");if(!F.pay)miss.push("medio de pago");
 if(miss.length){$("#er").style.color="var(--chili)";$("#er").textContent="Falta completar: "+miss.join(", ")+".";return}
 const t=`*Nuevo pedido - ${C.nombre}*\n\nCliente: ${g("nm")}\nDNI / C.I.: ${g("ci")}\nDirección: ${g("dr")}\nMedio de pago: ${F.pay}\n\n*Pedido*\n${lines().join("\n")}\n\n*Total: ${f(tot())}*${g("nt")?"\n\nNotas: "+g("nt"):""}`;
 const a=document.createElement("a");a.href=`https://wa.me/${C.wa}?text=${encodeURIComponent(t)}`;a.target="_blank";a.rel="noopener";a.click();
 const e=$("#er");e.style.color="var(--ink)";
 e.innerHTML=`<span style="font-weight:400">¿No se abrió WhatsApp? Copia el pedido y pégalo en el chat del <b>+593 99 840 3040</b>.</span><textarea id="tk" rows="6" readonly>${esc(t)}</textarea><button class="big alt" type="button" onclick="cp()"><span id="cpt">Copiar pedido</span></button>`;
}
function cp(){const x=$("#tk");x.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}$("#cpt").textContent=ok?"¡Copiado!":"Mantén presionado el texto para copiarlo"}
function closeS(){$("#sheet").hidden=true}
function reset(){for(const k in q)delete q[k];view="cart";closeS();draw()}
$("#open").onclick=()=>{view="cart";$("#sheet").hidden=false;sheet()};
$("#sheet").onclick=e=>{if(e.target.id==="sheet")closeS()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeS()});
draw();
</script>
</body>
</html>
